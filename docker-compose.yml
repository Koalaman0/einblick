version: '3.8'
services:
  oracle-db:
    image: container-registry.oracle.com/database/free:23.5.0.0
    container_name: einblick-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: oracle1234       # sys/system 공통 비번
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  oracle-data: