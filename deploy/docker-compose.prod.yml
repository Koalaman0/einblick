services:
  postgres:
    image: postgres:16
    container_name: einblick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: einblick
      POSTGRES_USER: einblick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../Backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einblick -d einblick"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../Backend
    container_name: einblick-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://einblick:${POSTGRES_PASSWORD}@postgres:5432/einblick
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    container_name: einblick-caddy
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
