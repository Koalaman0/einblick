services:
  postgres:
    image: postgres:16
    container_name: einblick-postgres
    restart: unless-stopped
    mem_limit: 300m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
    environment:
      POSTGRES_DB: einblick
      POSTGRES_USER: einblick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../Backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einblick -d einblick"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../Backend
    container_name: einblick-backend
    restart: unless-stopped
    mem_limit: 500m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://einblick:${POSTGRES_PASSWORD}@postgres:5432/einblick
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # E2.1.Micro는 1GB RAM뿐이라 힙/메타스페이스를 명시적으로 좁게 잡아야 OOM 없이 뜬다.
      JAVA_TOOL_OPTIONS: "-Xmx350m -Xss256k -XX:MaxMetaspaceSize=150m"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    container_name: einblick-caddy
    restart: unless-stopped
    mem_limit: 100m
    depends_on:
      - backend
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

