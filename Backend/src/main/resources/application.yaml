spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/einblick
    username: einblick
    password: einblick1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # DDL은 직접 관리, JPA는 검증만
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true